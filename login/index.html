<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>
        body{
            background:#111;
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            width:300px;
            padding:20px;
            background:#1e1e1e;
            border-radius:12px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:8px;
            outline:none;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:none;
            border-radius:8px;
            background:limegreen;
            color:white;
            cursor:pointer;
        }

        #message{
            margin-top:15px;
            text-align:center;
        }
    </style>
</head>
<body>

<div class="box">

    <h2>Register</h2>

    <form id="registerForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <div id="message"></div>

</div>

<script>

document.getElementById("registerForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    try{

        const response = await fetch(
            "https://herisusanta.my.id/javalogin/api/auth.php",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/x-www-form-urlencoded"
                },

                body:
                    `action=register` +
                    `&username=${encodeURIComponent(username)}` +
                    `&password=${encodeURIComponent(password)}`
            }
        );

        const text = await response.text();

        console.log(text);

        let data = JSON.parse(text);

        if(data.status === "success"){

            message.style.color = "lime";
            message.innerText = "Register berhasil!";

        }else{

            message.style.color = "red";
            message.innerText =
                data.message || "Register gagal";

        }

    }catch(err){

        console.error(err);

        message.style.color = "red";
        message.innerText =
            "Server error / JSON rusak";

    }

});

</script>

</body>
</html>
